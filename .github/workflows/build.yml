name: Build and Release

# Что делает:
#   - собирает два файла:
#       GDZLauncher.exe              — Windows, весь лаунчер в одном файле (без DLL и установки);
#       GDZLauncher-x86_64.AppImage  — Linux, один исполняемый файл;
#   - после сборки на push в main/master (и при ручном запуске) публикует релиз v<версия>,
#     где версия берётся из project(GDZLauncher VERSION ...) в CMakeLists.txt (сейчас 0.001).
#     Пока версия не меняется, каждый новый push заменяет файлы в этом же релизе;
#   - на pull request только собирает, без релиза.
#
# Адрес API и сервер задаются переменными репозитория (Settings -> Secrets and variables -> Actions -> Variables):
#   GDZ_API_URL         например https://example.org/launcher/
#   GDZ_SERVER_ADDRESS  например play.example.org:25565
# Без них собирается лаунчер без сервера проекта (чистый Forge 1.7.10).
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GDZ_API_URL: ${{ vars.GDZ_API_URL }}
  GDZ_SERVER_ADDRESS: ${{ vars.GDZ_SERVER_ADDRESS }}

jobs:
  # Windows (MSVC): один GDZLauncher.exe. Загрузчик WebView2 и C++ runtime (/MT) встроены,
  # нужны только системные библиотеки Windows 10/11.
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      shell: pwsh
      run: cmake -S . -B build -A x64 "-DGDZ_API_URL=$env:GDZ_API_URL" "-DGDZ_SERVER_ADDRESS=$env:GDZ_SERVER_ADDRESS"

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Collect
      shell: pwsh
      run: |
        $exe = "build/build/Release/GDZLauncher.exe"
        if (-not (Test-Path $exe)) { throw "Missing $exe" }
        New-Item -ItemType Directory -Force out | Out-Null
        Copy-Item $exe out/GDZLauncher.exe
        Get-ChildItem out

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: GDZLauncher-windows
        path: out/GDZLauncher.exe
        if-no-files-found: error

  # Linux: AppImage. Ubuntu 22.04 — чтобы файл запускался и на более старых дистрибутивах (glibc 2.35+).
  # Внутри только сам лаунчер; WebKitGTK 4.1 и libcurl берутся из системы.
  build-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev build-essential cmake pkg-config file

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGDZ_API_URL="$GDZ_API_URL" -DGDZ_SERVER_ADDRESS="$GDZ_SERVER_ADDRESS"

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Build AppImage
      run: |
        strip build/build/launcher
        bash scripts/build-appimage.sh build/build/launcher out/GDZLauncher-x86_64.AppImage
        ls -la out

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: GDZLauncher-linux
        path: out/GDZLauncher-x86_64.AppImage
        if-no-files-found: error

  # Сквозной тест на Linux: загрузка, синхронизация модов, запуск Java, работа без сети,
  # самообновление обычного бинарника и AppImage. На публикацию релиза не влияет.
  e2e-linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev build-essential cmake pkg-config file openjdk-8-jdk-headless xvfb

    - name: Build (test harness)
      run: |
        cmake -S . -B build-e2e -DCMAKE_BUILD_TYPE=Release -DGDZ_E2E_HARNESS=ON
        cmake --build build-e2e --parallel
        bash scripts/build-appimage.sh build-e2e/build/launcher build-e2e/GDZLauncher-x86_64.AppImage

    - name: Run end-to-end tests
      run: |
        python3 tests/e2e/run_e2e.py --launcher build-e2e/build/launcher \
          --appimage build-e2e/GDZLauncher-x86_64.AppImage --java-home /usr/lib/jvm/java-8-openjdk-amd64

  # Релиз сразу после сборки обоих файлов.
  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [ build-windows, build-linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
    - uses: actions/checkout@v4

    - name: Read version
      run: |
        VER=$(sed -n 's/^project(GDZLauncher VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
        if [ -z "$VER" ]; then echo "::error::Не найдена версия в CMakeLists.txt"; exit 1; fi
        echo "VERSION=$VER" >> "$GITHUB_ENV"
        echo "TAG=v$VER" >> "$GITHUB_ENV"
        echo "Версия: $VER"

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir -p release
        cp artifacts/GDZLauncher-windows/GDZLauncher.exe release/
        cp artifacts/GDZLauncher-linux/GDZLauncher-x86_64.AppImage release/
        chmod +x release/GDZLauncher-x86_64.AppImage
        # launcher.json для самообновления: ссылки ведут прямо на файлы этого релиза.
        python3 tools/make_manifest.py launcher --version "$VERSION" \
          --windows-exe release/GDZLauncher.exe \
          --linux-appimage release/GDZLauncher-x86_64.AppImage \
          --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
          --out release/launcher.json
        (cd release && sha256sum GDZLauncher.exe GDZLauncher-x86_64.AppImage launcher.json > SHA256SUMS.txt && cat SHA256SUMS.txt)

    - name: Publish release
      run: |
        # Та же версия — тот же релиз: удаляем прежний вместе с тегом и публикуем заново на текущем коммите.
        gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
        gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true
        SHORT="${GITHUB_SHA:0:7}"
        # shellcheck disable=SC2016  # обратные кавычки в заметках — разметка Markdown, а не подстановка
        {
          echo "GDZLauncher ${VERSION}"
          echo
          echo '- **Windows:** скачайте `GDZLauncher.exe` и запустите. Установка не нужна.'
          echo '- **Linux:** скачайте `GDZLauncher-x86_64.AppImage`, выполните `chmod +x GDZLauncher-x86_64.AppImage` и запустите.'
          echo '  Нужны системные WebKitGTK 4.1 и libcurl (Ubuntu/Debian: `sudo apt install libwebkit2gtk-4.1-0 libcurl4`).'
          echo
          echo "Сборка из коммита ${SHORT}."
        } > notes.md
        gh release create "$TAG" \
          release/GDZLauncher.exe \
          release/GDZLauncher-x86_64.AppImage \
          release/launcher.json \
          release/SHA256SUMS.txt \
          --target "$GITHUB_SHA" \
          --title "GDZLauncher $VERSION" \
          --notes-file notes.md \
          --latest
