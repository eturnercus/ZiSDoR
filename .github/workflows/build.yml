name: C++ Multi-platform CI

# Сборка запускается:
#   - на каждый push в main и на pull request в main (архивы доступны на странице запуска);
#   - при создании тега вида v1.2.3 (дополнительно публикуется релиз);
#   - вручную из вкладки Actions.
#
# Адрес API и сервер задаются переменными репозитория (Settings -> Secrets and variables -> Actions -> Variables):
#   GDZ_API_URL         например https://example.org/launcher/
#   GDZ_SERVER_ADDRESS  например play.example.org:25565
# Без них собирается лаунчер без сервера проекта (чистый Forge 1.7.10).
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GDZ_API_URL: ${{ vars.GDZ_API_URL }}
  GDZ_SERVER_ADDRESS: ${{ vars.GDZ_SERVER_ADDRESS }}

jobs:
  # Сборка под Linux. Ubuntu 22.04: бинарник запустится и на более новых дистрибутивах.
  build-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev build-essential cmake pkg-config

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGDZ_API_URL="$GDZ_API_URL" -DGDZ_SERVER_ADDRESS="$GDZ_SERVER_ADDRESS"

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Package
      run: |
        test -x build/build/launcher
        strip build/build/launcher
        mkdir -p dist/GDZLauncher
        cp build/build/launcher dist/GDZLauncher/
        tar -C dist -czf GDZLauncher-linux-x86_64.tar.gz GDZLauncher
        tar -tzf GDZLauncher-linux-x86_64.tar.gz

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: launcher-linux
        path: |
          GDZLauncher-linux-x86_64.tar.gz
          dist/GDZLauncher/launcher
        if-no-files-found: error

  # Сборка под Windows (MSVC)
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      shell: pwsh
      run: cmake -S . -B build -A x64 "-DGDZ_API_URL=$env:GDZ_API_URL" "-DGDZ_SERVER_ADDRESS=$env:GDZ_SERVER_ADDRESS"

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Package
      shell: pwsh
      run: |
        foreach ($f in 'Updater.exe', 'launcher.dll') {
          if (-not (Test-Path "build/build/Release/$f")) { throw "Missing $f" }
        }
        New-Item -ItemType Directory -Force dist/GDZLauncher | Out-Null
        Copy-Item build/build/Release/Updater.exe, build/build/Release/launcher.dll dist/GDZLauncher/
        Compress-Archive -Path dist/GDZLauncher -DestinationPath GDZLauncher-windows-x64.zip
        Get-ChildItem dist/GDZLauncher

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: launcher-windows
        path: |
          GDZLauncher-windows-x64.zip
          dist/GDZLauncher/Updater.exe
          dist/GDZLauncher/launcher.dll
        if-no-files-found: error

  # Windows-сборка кросс-компилятором MinGW-w64 из Linux (cmake/mingw-w64.cmake): запасной вариант к MSVC,
  # статически слинкована, нужны только системные библиотеки Windows.
  build-windows-mingw:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-mingw-w64-x86-64 cmake zip

    - name: Build
      run: |
        cmake -S . -B build-win -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake -DCMAKE_BUILD_TYPE=Release -DGDZ_API_URL="$GDZ_API_URL" -DGDZ_SERVER_ADDRESS="$GDZ_SERVER_ADDRESS"
        cmake --build build-win --parallel
        ls -la build-win/build/Updater.exe build-win/build/launcher.dll

    - name: Package
      run: |
        mkdir -p dist/GDZLauncher
        cp build-win/build/Updater.exe build-win/build/launcher.dll dist/GDZLauncher/
        (cd dist && zip -r ../GDZLauncher-windows-x64-mingw.zip GDZLauncher)

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: launcher-windows-mingw
        path: GDZLauncher-windows-x64-mingw.zip
        if-no-files-found: error

  # Сквозной тест на Linux: загрузка, синхронизация модов, запуск Java, работа без сети, самообновление.
  e2e-linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev build-essential cmake pkg-config openjdk-8-jdk-headless xvfb

    - name: Build (test harness)
      run: |
        cmake -S . -B build-e2e -DCMAKE_BUILD_TYPE=Release -DGDZ_E2E_HARNESS=ON
        cmake --build build-e2e --parallel

    - name: Run end-to-end tests
      run: python3 tests/e2e/run_e2e.py --launcher build-e2e/build/launcher --java-home /usr/lib/jvm/java-8-openjdk-amd64

  # Публикация релиза при пуше тега v*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-linux, build-windows, e2e-linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Check version
      run: |
        TAG="${GITHUB_REF_NAME#v}"
        VER=$(sed -n 's/^project(GDZLauncher VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
        echo "tag=$TAG cmake=$VER"
        if [ "$TAG" != "$VER" ]; then
          echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией $VER в CMakeLists.txt"
          exit 1
        fi
        echo "VERSION=$VER" >> "$GITHUB_ENV"

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir -p release
        cp artifacts/launcher-linux/GDZLauncher-linux-x86_64.tar.gz release/
        cp artifacts/launcher-windows/GDZLauncher-windows-x64.zip release/
        # Отдельные файлы для самообновления (на них ссылается launcher.json).
        cp artifacts/launcher-linux/dist/GDZLauncher/launcher release/launcher
        cp artifacts/launcher-windows/dist/GDZLauncher/Updater.exe release/Updater.exe
        cp artifacts/launcher-windows/dist/GDZLauncher/launcher.dll release/launcher.dll
        python3 tools/make_manifest.py launcher --version "$VERSION" \
          --windows-dir release --linux-bin release/launcher \
          --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
          --out release/launcher.json
        cd release
        sha256sum * > SHA256SUMS.txt
        cat SHA256SUMS.txt

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
        generate_release_notes: true
